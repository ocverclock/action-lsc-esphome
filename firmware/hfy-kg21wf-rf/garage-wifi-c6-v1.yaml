# HFY-KG21WF+RF V2.0 — remplacement Wi-Fi par ESP32-C6 Super Mini
# V1 : base de diagnostic uniquement, 16/11/2026.
# AUCUNE SORTIE GPIO, aucun relais, aucune interaction avec le Holychip U1.
# Premier flash sur Super Mini ISOLEE en USB-C ; ne pas alimenter la carte garage.
# Adapter les !secret localement ; ne pas publier les valeurs.
#
# ESPHome >= 2026.9 requis pour ota.encryption.
# La carte esp32-c6-devkitc-1 est le profil usuel de la C6 Super Mini.
# C6 GPIO4/5/8/9/15 : strapping. GPIO12/13 USB. Aucun GPIO déclaré ici.

# CÂBLAGE CHOISI PAR L'UTILISATEUR LE 16/11 — NON ACTIVE EN V1 :
# P10/RX1 CB2S -> GPIO18 C6 : attribution confirmée (ancien GPIO15 abandonné).
# P24 CB2S     -> GPIO0 C6  : signal vers D5/D6 à identifier
# P26 CB2S     -> GPIO19 C6 : WF-LED, polarité à identifier
# P6 CB2S      -> GPIO3 C6  : signal vers U1 à identifier
# P7 CB2S      -> GPIO2 C6  : signal vers U1 à identifier
# P8 CB2S      -> GPIO1 C6  : signal vers U1 à identifier
# NE PAS DECLARER CES GPIO EN SORTIE, ne pas alimenter la carte garage
# avant vérification de la tension et du sens des signaux (P10 ancien RX1).
# Ce YAML est une base NON TESTEE ; conserver le firmware C6 déjà fonctionnel.

esphome:
  name: garage-wifi-c6
  friendly_name: "Garage WiFi C6"
  comment: "HFY-KG21WF+RF V2.0 - ESP32-C6 Super Mini - diagnostic V1"

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret garage_c6_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid_IoT
  password: !secret wifi_password_IoT
  power_save_mode: NONE
  ap:
    ssid: "Garage-C6-Secours"
    password: !secret garage_c6_ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: admin
    password: !secret garage_c6_web_password

binary_sensor:
  - platform: status
    name: "Connexion"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Temps de fonctionnement"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      entity_category: diagnostic
    ssid:
      name: "Reseau WiFi"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Redemarrer ESP32"
    entity_category: diagnostic
