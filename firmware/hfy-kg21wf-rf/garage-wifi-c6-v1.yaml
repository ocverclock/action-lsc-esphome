# HFY-KG21WF+RF V2.0 — ESP32-C6 Super Mini
# V1.1 — Base fonctionnelle Wi-Fi / Home Assistant / OTA
#
# Cette version reprend le YAML C6 communiqué par l'utilisateur,
# sans modifier les secrets existants ni les réglages Wi-Fi en service.
#
# CÂBLAGE DEFINI (CB2S -> ESP32-C6) :
#   P10 / RX1 -> GPIO18
#   P24       -> GPIO0
#   P26       -> GPIO19  (WF-LED probable)
#   P6        -> GPIO3
#   P7        -> GPIO2
#   P8        -> GPIO1
#
# IMPORTANT :
# - Les substitutions ci-dessous sont une RESERVATION DOCUMENTAIRE.
# - AUCUN de ces GPIO n'est configuré en entrée ou sortie dans cette V1.
# - Ne pas déclarer de sortie ni piloter le portail avant de connaître
#   le sens, la tension, la polarité et l'état au démarrage des signaux.
# - L'ancien CB2S doit être isolé pour éviter un conflit électrique.
# - Vérifier l'alimentation 3,3 V et les masses avant mise sous tension.
# - Les signaux du Holychip U1 peuvent être à 5 V : à mesurer avant liaison.

substitutions:
  cb2s_p10_gpio: "18"
  cb2s_p24_gpio: "0"
  cb2s_p26_gpio: "19"
  cb2s_p6_gpio: "3"
  cb2s_p7_gpio: "2"
  cb2s_p8_gpio: "1"

esphome:
  name: garage-wifi-c6
  friendly_name: "Garage WiFi C6"
  comment: "HFY-KG21WF+RF V2.0 - ESP32-C6 Super Mini - diagnostic V1.1"

# Garde la variante que tu as déjà utilisée avec succès.
# ESPHome choisit automatiquement une carte générique adaptée au C6.
esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret garage_c3_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid_IoT
  password: !secret wifi_password_IoT
  power_save_mode: NONE
  output_power: 11dB

# Conserve la directive de ta base.
# Sans bloc "wifi.ap", aucun point d'accès de secours n'est défini.
captive_portal:

web_server:
  port: 80
  auth:
    username: admin
    password: !secret garage_c3_web_password

binary_sensor:
  - platform: status
    name: "Connexion"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Temps de fonctionnement"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      entity_category: diagnostic
    ssid:
      name: "Reseau WiFi"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Redemarrer ESP32"
    entity_category: diagnostic

# A VENIR (pas encore de composants GPIO ci-dessous) :
# - Détermination sens et rôle de P10 / P6 / P7 / P8 / P24
# - Pilotage ou surveillance éventuelle WF-LED / P26
# - Commandes CH1/CH2 avec durée d'impulsion et sécurité au boot
