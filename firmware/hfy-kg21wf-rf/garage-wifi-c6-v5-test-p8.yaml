# HFY-KG21WF+RF V2.0 — ESP32-C6 Super Mini
# V5 : essai ponctuel P8 / GPIO1 en open-drain (actif LOW).
#
# ATTENTION : P8 a été observé comme retour RF canal 2 (impulsion LOW).
# Sa direction électrique est INCONNUE : le Holychip peut être une SORTIE !
# NE PAS FLASHER/ACTIVER CE TEST AVANT :
#   - motorisation et moteur déconnectés ;
#   - vérification des tensions sur P8 : 0 à 3,3 V par rapport au GND ;
#   - insertion d'une résistance de 4,7 kOhm en série ENTRE GPIO1 et P8
#     (le câblage direct actuel ne suffit pas pour ce test) ;
#   - vérification de la masse commune et de l'alimentation du C6 :
#     5 V UNIQUEMENT sur l'entrée 5V de la Super Mini, pas sur 3V3.
# Ne pas alimenter simultanément par USB et 5V externe sans anti-retour.
# Une résistance limite le courant mais NE prouve PAS que P8 peut commander U1.
# Les autres lignes sont uniquement observées ; elles n'envoient aucun ordre.
#
# Correspondances CB2S vers C6 :
# P10 -> GPIO18 : diagnostic / input
# P24 -> GPIO0  : diagnostic / input
# P26 -> GPIO19 : WF-LED
# P6  -> GPIO3  : retour RF canal 1
# P7  -> GPIO2  : diagnostic / input
# P8  -> GPIO1  : ESSAI sortie LOW 80 ms, seule commande potentielle.

substitutions:
  pulse_duree: 80ms
  led_flash_duree: 150ms

esphome:
  name: garage-wifi-c6
  friendly_name: "Garage WiFi C6"
  comment: "KG21WF+RF V2.0 - P8 impulsion 80 ms open-drain V5"
  on_boot:
    priority: -100
    then:
      - output.turn_off: sortie_p8
      - output.turn_off: led_wifi
      - switch.turn_off: autoriser_test_p8

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret garage_c3_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid_IoT
  password: !secret wifi_password_IoT
  power_save_mode: NONE
  output_power: 11dB

captive_portal:

web_server:
  port: 80
  auth:
    username: admin
    password: !secret garage_c3_web_password

# GPIO1 est UNIQUEMENT une sortie dans cette version.
# En open-drain : ON => 0 V ; OFF => haute impédance.
output:
  - platform: gpio
    id: sortie_p8
    pin:
      number: GPIO1
      inverted: true
      mode:
        output: true
        open_drain: true

  - platform: gpio
    id: led_wifi
    pin:
      number: GPIO19
      inverted: true

# Armement absent au boot et jamais restauré après coupure.
switch:
  - platform: template
    id: autoriser_test_p8
    name: "AUTORISER test P8 (banc uniquement)"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

binary_sensor:
  - platform: status
    name: "Connexion"
    entity_category: diagnostic

  - platform: gpio
    name: "RF canal 1 - P6"
    entity_category: diagnostic
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: false
        pulldown: false
      inverted: true

  - platform: gpio
    name: "P7 - GPIO2 (lecture)"
    entity_category: diagnostic
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: false
        pulldown: false

  - platform: gpio
    name: "P10 - GPIO18 (lecture)"
    entity_category: diagnostic
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: false
        pulldown: false

  - platform: gpio
    name: "P24 - GPIO0 (lecture)"
    entity_category: diagnostic
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: false
        pulldown: false

script:
  - id: flash_wf_led
    mode: restart
    then:
      - output.turn_on: led_wifi
      - delay: ${led_flash_duree}
      - output.turn_off: led_wifi

  - id: test_impulsion_p8
    mode: single
    then:
      - if:
          condition:
            switch.is_on: autoriser_test_p8
          then:
            - logger.log: "Essai P8 : impulsion LOW pendant 80 ms"
            - output.turn_on: sortie_p8
            - delay: ${pulse_duree}
            - output.turn_off: sortie_p8
            - script.execute: flash_wf_led
          else:
            - logger.log: "Essai P8 bloque : verrou non arme"

button:
  - platform: template
    name: "TEST P8 - impulsion 80 ms"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: test_impulsion_p8

  - platform: template
    name: "TEST WF-LED seule"
    on_press:
      - script.execute: flash_wf_led

  - platform: restart
    name: "Redemarrer ESP32"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Temps de fonctionnement"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      entity_category: diagnostic
    ssid:
      name: "Reseau WiFi"
      entity_category: diagnostic

# Dans cette V5, P8 ne peut pas être observé en binary_sensor car il est
# réservé à la sortie d'essai. Revenir à V3 pour surveiller le retour RF2.
