# HFY-KG21WF+RF V2.0 — remplacement Wi-Fi par ESP32-C3 Super Mini
# V1 : base de diagnostic uniquement, 16/11/2026.
# AUCUNE SORTIE GPIO, aucun relais, aucune interaction avec le Holychip U1.
# Premier flash sur Super Mini ISOLEE en USB-C ; ne pas alimenter la carte garage.
# Adapter les !secret localement ; ne pas publier les valeurs.
#
# ESPHome >= 2026.9 requis pour ota.encryption.
# La carte esp32-c3-devkitm-1 est le profil usuel de la C3 Super Mini.
# GPIO2/8/9 : broches de strapping. Aucun GPIO n'est déclaré ici.

esphome:
  name: garage-wifi-c3
  friendly_name: "Garage WiFi C3"
  comment: "HFY-KG21WF+RF V2.0 - ESP32-C3 Super Mini - diagnostic V1"

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret garage_c3_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid_IoT
  password: !secret wifi_password_IoT
  power_save_mode: NONE
  ap:
    ssid: "Garage-C3-Secours"
    password: !secret garage_c3_ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: admin
    password: !secret garage_c3_web_password

binary_sensor:
  - platform: status
    name: "Connexion"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Signal WiFi"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Temps de fonctionnement"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      entity_category: diagnostic
    ssid:
      name: "Reseau WiFi"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Redemarrer ESP32"
    entity_category: diagnostic
