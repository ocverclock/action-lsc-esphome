# PROTOTYPE / NE PAS FLASHER AVANT VALIDATION PHYSIQUE DU PCB.
# Action / LSC 5225000500, variante francaise. Correspondance supposee avec
# 3202887 AL E24748 : CB3S / BK7231N, mais NON CONFIRMEE sur cet exemplaire.
# GPIO P14/P6/P7/P8 et leurs polarites a verifier sur la carte OUVERTE HORS SECTEUR.
# Aucun branchement 230 V pendant une session UART, meme pour un test.
# Les quatre relais sont commandes independamment et demarrent logiquement OFF.
# ATTENTION : "ALWAYS_OFF" ne garantit PAS l'absence de commutation physique
# pendant le boot ni l'etat hors tension si la polarite GPIO est differente.
# Source du mapping de reference :
# https://www.elektroda.com/rtvforum/topic4080696.html
#
# NE PAS COPIER LES CLES OU MOTS DE PASSE DANS CE DEPOT PUBLIC.
# Creer localement les secrets indiques ci-dessous dans ESPHome.

esphome:
  name: multiprise-tv
  friendly_name: "Multiprise TV"
  comment: "LSC Action CB3S/BK7231N - prototype quatre relais, a valider"

bk72xx:
  board: cb3s

logger:
  # P10/P11 = UART1 utilise pour le flash; pas de logs serie apres programmation.
  baud_rate: 0
  level: INFO

# ESPHome fonctionne sans HA. L'API ne doit pas forcer des redemarrages
# lorsque Home Assistant est absent/injoignable.
api:
  encryption:
    key: !secret multiprise_tv_api_key
  reboot_timeout: 0s

# Les futures mises a jour ESPHome utilisent la meme cle que l'API.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid_IoT
  password: !secret wifi_password_IoT
  power_save_mode: NONE
  reboot_timeout: 0s
  ap:
    ssid: "Multiprise-TV-Secours"
    password: !secret multiprise_tv_ap_password

captive_portal:

# Acces local par navigateur SANS Home Assistant ni Internet.
web_server:
  port: 80
  local: true
  ota: false
  auth:
    username: admin
    password: !secret multiprise_tv_web_password
    type: digest

# Sur le modele publie : LED Wi-Fi P23 active LOW ("WifiLED_n").
# A verifier avant de garder ce bloc.
status_led:
  pin:
    number: P23
    inverted: true

# Sur la carte 3202887 publiee, relais 1/2/3/4 : P14/P6/P7/P8.
# Les numero 1..4 sont PROVISOIRES ; leur position physique est a verifier.
# ATTENTION : polarite supposée active HIGH, non verifiee sur notre carte.
switch:
  - platform: gpio
    id: relais_1
    name: "Sortie 1"
    pin:
      number: P14
      inverted: false
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_2
    name: "Sortie 2"
    pin:
      number: P6
      inverted: false
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_3
    name: "Sortie 3"
    pin:
      number: P7
      inverted: false
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relais_4
    name: "Sortie 4"
    pin:
      number: P8
      inverted: false
    restore_mode: ALWAYS_OFF

# Commande explicite pour desactiver logiquement les quatre sorties.
button:
  - platform: template
    name: "Tout eteindre"
    icon: mdi:power-off
    on_press:
      - switch.turn_off: relais_1
      - switch.turn_off: relais_2
      - switch.turn_off: relais_3
      - switch.turn_off: relais_4

  - platform: restart
    name: "Redemarrer le module"
    entity_category: diagnostic

# Bouton physique P10 ("Btn_Tgl_All" sur le demontage) volontairement
# NON ACTIVE dans ce prototype ; il faut confirmer polarite, pull-up,
# rebond et logique de commande avant d'autoriser "tout allumer".
# Ne pas copier le code bouton de la prise simple 5225000301 (P26).

binary_sensor:
  - platform: status
    name: "Connexion API"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: "Temps depuis redemarrage"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ssid:
      name: "Reseau Wi-Fi actif"
      entity_category: diagnostic
    ip_address:
      name: "Adresse IP Wi-Fi"
      entity_category: diagnostic
